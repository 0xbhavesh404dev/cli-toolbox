name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          python -m unittest discover -v
          code=$?
          # exit code 5 means "no tests found" - fine for scaffolding PRs
          if [ "$code" -eq 5 ]; then
            echo "No tests discovered yet, nothing to run."
            exit 0
          fi
          exit "$code"
